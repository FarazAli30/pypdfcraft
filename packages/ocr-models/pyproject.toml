[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pypdfcraft-ocr-models"
version = "0.1.0"
description = "Text-recognition models (ocrs, CC-BY-SA-4.0) for pypdfcraft's OCR - install with `pip install pypdfcraft[ocr]`."
readme = "README.md"
requires-python = ">=3.9"
license = "CC-BY-SA-4.0"
authors = [{ name = "Faraz Ali", email = "farazjankhushk@gmail.com" }]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: Image Recognition"]
dependencies = []

[project.urls]
Homepage = "https://github.com/FarazAli30/pypdfcraft"
"Model source (ocrs-models)" = "https://github.com/robertknight/ocrs-models"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pypdfcraft_ocr_models = ["models/*"]
