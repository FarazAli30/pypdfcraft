name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.99.0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check src/pypdfcraft/api.py src/pypdfcraft/features.py src/pypdfcraft/editing.py || true

  python-tests:
    name: python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - name: Unit tests (fake engine, no native library needed)
        run: pytest -m "not engine"

  generated-files-in-sync:
    name: bindings / one-shot module are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ env.RUST_TOOLCHAIN }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the engine (debug-ish, only needed for its metadata)
        working-directory: rust
        env:
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
          CARGO_PROFILE_RELEASE_LTO: "false"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
        run: cargo build --release --locked -p pdfcraft-android
      - name: Regenerate UniFFI bindings
        run: python scripts/gen_bindings.py rust/target/release/libpdfcraft_android.so
      - name: Regenerate tool catalogue and typed one-shot module
        run: |
          pip install -e .
          PDFCRAFT_LIB=$PWD/rust/target/release/libpdfcraft_android.so python -m pypdfcraft catalog --json src/pypdfcraft/data/tools_catalog.json
          python scripts/gen_oneshot.py
      - name: Fail if anything changed
        run: git diff --exit-code -- src/pypdfcraft/_bindings.py src/pypdfcraft/oneshot.py src/pypdfcraft/data/tools_catalog.json

  rust-tests:
    name: rust tests (ffi crate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: "${{ env.RUST_TOOLCHAIN }}" }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: rust }
      - working-directory: rust
        run: cargo test --locked -p pdfcraft-android
